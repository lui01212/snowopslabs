# Grafana Alloy values for log shipping - the single source of truth.
#
# The `alloy-logs` release runs one Alloy per node and ships that node's pod
# logs to Loki. It replaces Promtail, which is end-of-life upstream (ADR-0012).
# Scenarios reference this file via
# `platformValues: logging/loki/alloy-logs-values.yaml` rather than keeping
# their own copy.
#
# The trace gateway in observability-sre is a separate Alloy release: one
# replica receiving OTLP over the network, where this one reads files on every
# node.

controller:
  type: daemonset
  volumes:
    extra:
      # The node directory behind alloy.storagePath.
      - name: positions
        hostPath:
          path: /var/lib/alloy-logs
          type: DirectoryOrCreate

# The PodLogs CRD is for loki.source.podlogs, which this config does not use.
crds:
  create: false

alloy:
  # Read the pod log files the kubelet writes on the node.
  mounts:
    varlog: true
    extra:
      - name: positions
        mountPath: /var/lib/alloy-logs

  # Read positions live on the node, as Promtail's did, so a restarted pod
  # carries on where it stopped instead of shipping every file again.
  storagePath: /var/lib/alloy-logs

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

  configMap:
    content: |
      // Pods on this node only. The chart sets HOSTNAME to the node name.
      discovery.kubernetes "pods" {
        role = "pod"

        selectors {
          role  = "pod"
          field = "spec.nodeName=" + sys.env("HOSTNAME")
        }
      }

      // Without app and namespace, logs carry no label a query can filter on,
      // and {app="go-api"} matches nothing: the dashboards look broken when
      // the label was simply never attached.
      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_pod_label_app"]
          target_label  = "app"
        }

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }

        // The kubelet writes /var/log/pods/<ns>_<pod>_<uid>/<container>/<n>.log.
        rule {
          source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          target_label  = "__path__"
          replacement   = "/var/log/pods/*$1/*.log"
        }
      }

      local.file_match "pods" {
        path_targets = discovery.relabel.pods.output
      }

      loki.source.file "pods" {
        targets    = local.file_match.pods.targets
        forward_to = [loki.process.pods.receiver]
      }

      loki.process "pods" {
        // Container runtime wrapper: strips the CRI timestamp/stream prefix so
        // the stored line is the application's own output (JSON, for go-api).
        stage.cri {}

        // Keep stack traces attached to the line that started them.
        stage.multiline {
          firstline     = `^\d{4}-\d{2}-\d{2}|\[|{"|level=`
          max_wait_time = "3s"
        }

        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push"
        }
      }
